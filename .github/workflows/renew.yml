name: Host-Ship 自动续约

on:
  schedule:
    # 每 7 日 1 次（周日 UTC 04:00 = 北京 12:00）
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (不真正续约)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: hostship-renew
  cancel-in-progress: false

jobs:
  renew:
    name: 续约
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出
        uses: actions/checkout@v7

      # 迁移说明：原先手写 setup-python / pip install / 执行 三步，
      # 现改用 renew-kit 的 composite action，自动装好 Python 与 renewkit，
      # 并在脚本异常退出时兜底发一条 Telegram 通知。
      # 面板凭据通过本 step 的 env 传入，composite action 会继承。
      - name: 执行续约
        uses: jardanlau2020/renew-kit/.github/actions/renew@main
        with:
          script: renew.py
          python-version: "3.12"
          requirements: requirements.txt
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          PANEL_USER: ${{ secrets.PANEL_USER }}
          PANEL_PASS: ${{ secrets.PANEL_PASS }}
          SERVER_IDS: ${{ secrets.SERVER_IDS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
